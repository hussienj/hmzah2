
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎓</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>متوسطة الحمزة للبنين</title>  
    <meta name="google-site-verification" content="DqVnUTHGoteKNHzZei8hgfPZyw7BDBpzY0ZXLPkNgrQ" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <script src="./vendor/xlsx.full.min.js"></script>
    <script src="./vendor/exceljs.min.js"></script>
    <script src="./vendor/jspdf.umd.min.js"></script>

    <script src="./vendor/qrcode.min.js"></script>
    <!-- Word Export Library -->
    <script src="./vendor/docx.min.js"></script>
    <script src="./vendor/FileSaver.min.js"></script>
    
    <!-- ES Module Shims for cross-browser compatibility -->
    <script async src="https://ga.jspm.io/npm:es-module-shims@1.10.1/dist/es-module-shims.js"></script>

    <script>
      if (typeof window !== 'undefined') {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
      }
    </script>
    <style>
      body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
      #app-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: white; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
      }
      .spinner {
        width: 50px; height: 50px; border: 5px solid #f3f3f3;
        border-top: 5px solid #0891b2; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #manual-entry {
        margin-top: 20px; padding: 10px 20px; background: #0891b2;
        color: white; border-radius: 8px; font-weight: bold;
        display: none; cursor: pointer; border: none;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "html5-qrcode": "https://esm.sh/html5-qrcode@^2.3.8",
        "uuid": "https://esm.sh/uuid@^13.0.0",
        "vite": "https://esm.sh/vite@^7.3.0",
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "path": "https://esm.sh/path@^0.12.7",
        "@dnd-kit/core": "https://esm.sh/@dnd-kit/core@^6.3.1",
        "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="app-loader">
      <div class="spinner"></div>
      <p style="margin-top: 20px; font-weight: bold; color: #334155;">جاري تهيئة النظام الذكي...</p>
      <button id="manual-entry" onclick="forceLoadApp()">دخول اضطراري للنظام</button>
    </div>
    <div id="root"></div>
    <script>
      // دالة إخفاء شاشة التحميل
      window.hideAppLoader = function() {
        const loader = document.getElementById('app-loader');
        if (loader) loader.style.display = 'none';
      };

      // الدخول القسري في حال التعليق
      function forceLoadApp() {
        console.log('Force loading app...');
        window.hideAppLoader();
        if (!document.querySelector('script[src="index.tsx"]')) {
           injectMainScript();
        }
      }

      // إظهار زر الدخول اليدوي بعد 6 ثواني
      setTimeout(() => {
        const btn = document.getElementById('manual-entry');
        if (btn && document.getElementById('app-loader').style.display !== 'none') {
          btn.style.display = 'block';
        }
      }, 6000);

      function injectMainScript() {
        const script = document.createElement('script');
        script.type = 'module';
        script.src = 'index.tsx';
        script.onload = window.hideAppLoader;
        script.onerror = window.hideAppLoader;
        document.body.appendChild(script);
      }

      async function initializeApp() {
        if ('serviceWorker' in navigator) {
          try {
            const registration = await navigator.serviceWorker.register('sw.js');
            
            // إذا كان النظام متحكماً بالصفحة بالفعل
            if (navigator.serviceWorker.controller) {
              injectMainScript();
            } else {
              // انتظر حتى يتم التفعيل أو السيطرة
              navigator.serviceWorker.addEventListener('controllerchange', () => {
                window.location.reload();
              });

              // لمتصفحات معينة قد لا يرسل controllerchange
              if (registration.active) {
                setTimeout(() => {
                    if (!navigator.serviceWorker.controller) window.location.reload();
                }, 1000);
              }
            }
          } catch (error) {
            console.error('Service Worker failed, falling back:', error);
            injectMainScript();
          }
        } else {
          injectMainScript();
        }
      }

      initializeApp();
    </script>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
