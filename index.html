    <script>
      if (typeof window !== 'undefined') {
        window.process = window.process || {};
        window.process.env = window.process.env || {};
      }
      // إزالة أي Service Worker قديم لمنع التعليق وحلقات إعادة التحميل
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for (var i = 0; i < registrations.length; i++) {
            registrations[i].unregister();
          }
        }).catch(function() {});
      }
    </script>
    <style>
      body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; margin: 0; padding: 0; }
      #app-loader {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #f8fafc; display: flex; flex-direction: column;
        align-items: center; justify-content: center; z-index: 9999;
        transition: opacity 0.3s ease;
      }
      .spinner {
        width: 50px; height: 50px; border: 5px solid #e2e8f0;
        border-top: 5px solid #0891b2; border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
      #manual-entry {
        margin-top: 20px; padding: 10px 20px; background: #0891b2;
        color: white; border-radius: 8px; font-weight: bold;
        display: none; cursor: pointer; border: none;
      }
    </style>
    <link rel="stylesheet" href="/index.css">
  </head>
  <body>
    <div id="app-loader">
      <div class="spinner"></div>
      <p style="margin-top: 20px; font-weight: bold; color: #334155;">جاري تهيئة النظام المدرسي...</p>
      <button id="manual-entry" onclick="hideAppLoader()">دخول فوري للنظام</button>
    </div>
    <div id="root"></div>

    <script>
      // دالة إخفاء شاشة التحميل
      window.hideAppLoader = function() {
        const loader = document.getElementById('app-loader');
        if (loader) {
          loader.style.opacity = '0';
          setTimeout(function() {
            if (loader) loader.style.display = 'none';
          }, 300);
        }
      };

      // إظهار زر الدخول اليدوي بعد ثانيتين فقط إن تأخر التحميل
      setTimeout(function() {
        var btn = document.getElementById('manual-entry');
        var loader = document.getElementById('app-loader');
        if (btn && loader && loader.style.display !== 'none') {
          btn.style.display = 'block';
        }
      }, 2000);

      // أمان إضافي لإخفاء شاشة التحميل تلقائياً
      window.addEventListener('load', function() {
        setTimeout(function() {
          window.hideAppLoader();
        }, 1200);
      });
    </script>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
